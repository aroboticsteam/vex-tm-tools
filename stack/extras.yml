# Optional profiles: lighting tracker, Mumble voice, Cloudflare tunnel.
# Part of compose.stack.yml (see its header for configuration).

services:
  # Small caching resolver for the site LAN: answers BASE_DOMAIN and *.BASE_DOMAIN
  # with DNS_ANSWER_IP (this server) and forwards everything else to DNS_UPSTREAM.
  # Point DHCP/clients at DNS_BIND_IP. Binds that one address only (the tunnel
  # agent already holds 127.0.0.153:53 on the host).
  dns:
    profiles: [dns]
    image: alpine:3.20
    entrypoint: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null && exec dnsmasq --keep-in-foreground --no-daemon --no-resolv --no-hosts --interface=eth0 --cache-size=1000 --log-queries=extra --log-facility=- --server=${DNS_UPSTREAM:-1.1.1.1} --address=/${BASE_DOMAIN:-vex.localhost}/${DNS_ANSWER_IP:-127.0.0.1} --address=/qecomp-server.local/${DNS_ANSWER_IP:-127.0.0.1}"]
    ports:
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
    cap_add: [NET_ADMIN]
    restart: unless-stopped

  # Public robotics sites (aroboticsteam/robotics-home and robotics-stats):
  # https://BASE (landing page) and https://stats.BASE (VEX IQ / V5 leaderboards,
  # which proxies the RobotEvents API with VEX_API_KEY). Images come from the
  # local registry because the school network blocks ghcr.io. Behind Traefik only
  # (no published ports). Branding via SITES_* in .env (SITES_NAV_LINKS / SITES_CARDS
  # are JSON arrays; logos/images go in SITES_MEDIA_DIR, served at /media/).
  site-home:
    profiles: [sites]
    image: ${SITE_HOME_IMAGE:-registry.kmnet.uk/robotics-home:latest}
    environment:
      SITE_TITLE: ${SITES_TITLE:-QE Robotics}
      TAGLINE: ${SITES_TAGLINE:-}
      WELCOME_HEADING: ${SITES_WELCOME_HEADING:-}
      STATS_URL: https://stats.${BASE_DOMAIN:-vex.localhost}
      NAV_LINKS: ${SITES_NAV_LINKS:-}
      CARDS: ${SITES_CARDS:-}
      LOGO_URL: ${SITES_LOGO_URL:-}
      LOGO_ALT: ${SITES_LOGO_ALT:-}
      LOGO_HREF: ${SITES_LOGO_HREF:-}
      LOGO_WHITE_BG: ${SITES_LOGO_WHITE_BG:-true}
      FOOTER_TEXT: ${SITES_FOOTER_TEXT:-}
      FOOTER_SECONDARY_TEXT: ${SITES_FOOTER_SECONDARY_TEXT:-VEX Robotics Competition}
    volumes:
      - ${SITES_MEDIA_DIR:-./sites-media}:/media:ro
    restart: unless-stopped

  site-stats:
    profiles: [sites]
    image: ${SITE_STATS_IMAGE:-registry.kmnet.uk/robotics-stats:latest}
    environment:
      VEX_API_KEY: ${VEX_API_KEY:-}
      TEAMS_VIQRC: ${TEAMS_VIQRC:-}
      TEAMS_V5RC: ${TEAMS_V5RC:-}
      SITE_TITLE: ${SITES_TITLE:-QE Robotics} Stats
      HOME_URL: https://${BASE_DOMAIN:-vex.localhost}
      LOGO_URL: ${SITES_LOGO_URL:-}
      LOGO_ALT: ${SITES_LOGO_ALT:-}
      LOGO_HREF: ${SITES_LOGO_HREF:-}
      LOGO_WHITE_BG: ${SITES_LOGO_WHITE_BG:-true}
      FOOTER_TEXT: ${SITES_FOOTER_TEXT:-}
      FOOTER_SECONDARY_TEXT: ${SITES_FOOTER_SECONDARY_TEXT:-VEX Robotics Competition}
    volumes:
      - ${SITES_MEDIA_DIR:-./sites-media}:/media:ro
    restart: unless-stopped

  # Lighting tracker (aroboticsteam/lightpoint). Host networking so the
  # console's ArtPoll broadcast reaches it; the web UI binds to docker0 only and
  # is published solely through Traefik + Authelia at https://lighting.BASE.
  lighting:
    profiles: [lighting]
    image: ${LIGHTING_IMAGE:-ghcr.io/aroboticsteam/lightpoint:latest}
    network_mode: host
    environment:
      WEB_HOST: ${HOST_GATEWAY_IP:-172.17.0.1}
      WEB_PORT: "8080"
    volumes:
      - ${LIGHTING_CONFIG_DIR:-./lighting-config}:/config
    healthcheck:
      # The image probes 127.0.0.1; the UI is bound to docker0 instead.
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://%s:%s/api/state' % (os.environ['WEB_HOST'], os.environ['WEB_PORT']), timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  # Voice for the desks and iPads. LAN only: plain TCP/UDP, not behind Traefik.
  # Uses Mumble's own self-signed certificate (a trusted one via
  # traefik-certs-dumper is a follow-up). Data in the `mumble` volume.
  mumble:
    profiles: [voice]
    image: mumblevoip/mumble-server:v1.6.1001
    environment:
      MUMBLE_CONFIG_SERVERPASSWORD: ${MUMBLE_PASSWORD:-}
      MUMBLE_CONFIG_WELCOMETEXT: "QE Comp voice"
      MUMBLE_CONFIG_USERS: "100"
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - mumble:/data
    restart: unless-stopped

  # Cloudflare tunnel for the public competitors page only. Cloudflare terminates
  # TLS; the tunnel's public hostname (comp.BASE) points at http://traefik:8081,
  # an entrypoint that serves only the allowlisted /site paths (see cfg_dynamic).
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # TCP 7844 instead of QUIC/UDP, friendlier to firewalls.
      TUNNEL_TRANSPORT_PROTOCOL: http2
      SSL_CERT_FILE: /certs/ca-bundle.pem
    volumes:
      - certs:/certs:ro
    depends_on:
      traefik:
        condition: service_started
    restart: unless-stopped

volumes:
  mumble:
