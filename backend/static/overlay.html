<!DOCTYPE html>
<!--
  Standalone OBS overlay page (plan §5.14 / Appendix A.4, A.6, B.3).

  Per Appendix B.3, this is NOT part of the React SPA — a standalone HTML +
  vanilla JS page, no build step, served directly by FastAPI at
  GET /overlay/{entity_id}. The server is expected to:

    1. Read this file's bytes once at import time (mirroring
       `backend/main.py`'s `_PROMPTER_HTML` pattern).
    2. JSON-encode and substitute the `"__ENTITY_ID__"` placeholder below
       with the `entity_id` path parameter.
    3. Return the result as an `HTMLResponse`.

  Per Appendix A.1/A.15 there is NO auth on this page or its WebSocket —
  "security by obscurity of the entity_id" is the accepted model, since the
  URL is only ever pasted into an OBS Browser Source, not exposed to
  end users.

  Canvas is fixed at 1920x1080 (Appendix B.3: "designed for 1920x1080,
  document in OBS setup guide") — OBS Browser Sources render a page at a
  fixed pixel size, so this page does not attempt to be responsive.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TMTools Overlay</title>
<style>
  /* Fully transparent page: OBS composites straight through (Appendix A.6).
     No background panels or borders — only the clips and the info boxes. */
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; color: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; background: transparent; }
  #grid { position: absolute; inset: 0; opacity: 0; transition: opacity 500ms ease; pointer-events: none; }
  #grid.visible { opacity: 1; }

  /* Clip areas: the clip keeps its own (square-ish) ratio, never cropped. */
  .clip { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  .clip video { max-width: 100%; max-height: 100%; width: auto; height: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: transparent; }
  .clip .placeholder { font-size: 64px; font-weight: 700; letter-spacing: 0.06em; color: rgba(255,255,255,0.35); text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  /* Info boxes */
  .info { box-sizing: border-box; border-radius: 18px; padding: 18px 24px; display: flex; gap: 18px; align-items: center; background: rgba(32, 76, 190, 0.92); }
  .info.red { background: rgba(200, 40, 52, 0.92); }
  .info.blue { background: rgba(32, 76, 190, 0.92); }
  .rank { flex: none; min-width: 52px; padding: 6px 10px; text-align: center; font-size: 30px; font-weight: 800; border-radius: 10px; background: rgba(0,0,0,0.35); }
  .rank:empty { display: none; }
  .info .text { min-width: 0; }
  .info .number { font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: 0.03em; }
  .info .name { font-size: 28px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info .robot { font-size: 22px; font-style: italic; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info .meta { font-size: 22px; line-height: 1.25; color: rgba(255,255,255,0.88); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info.compact .number { font-size: 38px; } .info.compact .name { font-size: 24px; }

  /* IQ: bots in the top two quarters, info boxes in the bottom two. */
  #grid.mode-iq { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 3fr 2fr; gap: 24px 48px; padding: 36px 48px; }
  #grid.mode-iq .info { align-self: start; }

  /* VRC: one bot per quarter with its info box beside it (red/blue alliance boxes). */
  #grid.mode-vrc { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 24px 48px; padding: 36px 48px; }
  .quarter { display: flex; align-items: center; gap: 20px; min-width: 0; min-height: 0; }
  .quarter .clip { flex: none; height: 100%; aspect-ratio: 1 / 1; }
  .quarter .info { flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; gap: 8px; }

  /* Finals spotlight: robot 360 + info on the left half, team clip on the right half. */
  #grid.mode-finals { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 36px 48px; }
  #grid.mode-finals .left { display: flex; flex-direction: column; gap: 24px; min-height: 0; }
  #grid.mode-finals .left .clip { flex: 1; }
  #grid.mode-finals .right .clip { height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG = { entityId: "__ENTITY_ID__" };

  function fallbackFromUrl() {
    var path = window.location.pathname.split("/").filter(Boolean);
    var idx = path.indexOf("overlay");
    if (CONFIG.entityId === "__ENTITY_ID__" && idx !== -1 && path[idx + 1]) {
      CONFIG.entityId = decodeURIComponent(path[idx + 1]);
    }
  }
  fallbackFromUrl();

  var query = new URLSearchParams(window.location.search);
  var gridEl = document.getElementById("grid");
  var lastMatch = null;     // last upcoming_match payload (so spotlight can return to it)
  var spotlightTeam = null; // team number being featured (finals mode), or null

  // ── Flags (UK / Turkey, per issue #12; others show no flag) ───────────
  var UK_NAMES = ["united kingdom", "uk", "u.k.", "great britain", "gb", "england", "scotland", "wales", "northern ireland"];
  var TR_NAMES = ["turkey", "türkiye", "turkiye"];
  function flagFor(country) {
    var c = String(country || "").trim().toLowerCase();
    if (UK_NAMES.indexOf(c) !== -1) return "🇬🇧";
    if (TR_NAMES.indexOf(c) !== -1) return "🇹🇷";
    return "";
  }

  function teamNumberOf(t) {
    return (typeof t === "string") ? t : (t && (t.team_number || t.number)) || "";
  }

  // Merges the match payload's team entry (string or enriched object) with
  // the public overlay feed's display info + clip URLs.
  function normalizeTeam(team, feed) {
    var obj = (typeof team === "string") ? { team_number: team } : (team || {});
    var number = obj.team_number || obj.number || "";
    var info = (feed && feed[number]) || {};
    return {
      team_number: number,
      team_name: info.team_name || obj.team_name || obj.name || null,
      organisation: info.organisation || null,
      location: info.location || null,
      country: info.country || null,
      rank: (info.qual_rank != null ? info.qual_rank : obj.rank) || null,
      bot_url: info.bot_url || obj.video_url || null,
      team_url: info.team_url || null,
      robot_name: info.robot_name || null
    };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null && text !== "") e.textContent = text;
    return e;
  }

  function buildClip(url, fallbackText) {
    var box = el("div", "clip");
    if (url) {
      var v = document.createElement("video");
      v.src = url; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
      box.appendChild(v);
    } else if (fallbackText) {
      box.appendChild(el("div", "placeholder", fallbackText));
    }
    return box;
  }

  function buildInfo(team, color, opts) {
    opts = opts || {};
    var box = el("div", "info " + (color || "blue") + (opts.compact ? " compact" : ""));
    box.appendChild(el("div", "rank", team.rank != null ? String(team.rank) : ""));
    var text = el("div", "text");
    text.appendChild(el("div", "number", team.team_number));
    if (team.team_name) text.appendChild(el("div", "name", team.team_name));
    if (showRobotName && team.robot_name) text.appendChild(el("div", "robot", "🤖 " + team.robot_name));
    if (!opts.minimal) {
      if (team.organisation) text.appendChild(el("div", "meta", team.organisation));
      var loc = [flagFor(team.country), team.location].filter(Boolean).join(" ");
      if (loc) text.appendChild(el("div", "meta", loc));
    }
    box.appendChild(text);
    return box;
  }

  var showRobotName = false; // set from the feed (server opt-in) or ?robot_name=1

  function fetchFeed(teamNumbers) {
    if (!teamNumbers.length) return Promise.resolve({});
    var qs = encodeURIComponent(teamNumbers.join(","));
    return fetch("/api/v1/public/overlay/teams?teams=" + qs, { credentials: "same-origin" })
      .then(function (resp) { if (!resp.ok) throw new Error("overlay feed " + resp.status); return resp.json(); })
      .then(function (data) {
        showRobotName = !!(data && data.show_robot_name) || query.get("robot_name") === "1";
        return (data && data.teams) || {};
      })
      .catch(function () { return {}; }); // no feed -> placeholders, never throws
  }

  var fadeTimer = null;
  function clearGrid() {
    gridEl.classList.remove("visible");
    if (fadeTimer) window.clearTimeout(fadeTimer);
    fadeTimer = window.setTimeout(function () { gridEl.innerHTML = ""; gridEl.className = ""; }, 500);
  }

  function show(modeClass, build) {
    if (fadeTimer) { window.clearTimeout(fadeTimer); fadeTimer = null; }
    gridEl.innerHTML = "";
    gridEl.classList.remove("visible");
    gridEl.className = modeClass;
    build(gridEl);
    // eslint-disable-next-line no-unused-expressions
    gridEl.offsetHeight;
    gridEl.classList.add("visible");
  }

  // IQ: [bot A][bot B] on top, [info A][info B] below (both blue).
  function layoutIq(teams) {
    show("mode-iq", function (g) {
      teams.forEach(function (t) { g.appendChild(buildClip(t.bot_url, t.team_number)); });
      teams.forEach(function (t) { g.appendChild(buildInfo(t, "blue")); });
    });
  }

  // VRC: red alliance on the top row, blue on the bottom; a bot + info box per quarter.
  function layoutVrc(red, blue) {
    show("mode-vrc", function (g) {
      red.concat(blue).forEach(function (t, i) {
        var q = el("div", "quarter");
        q.appendChild(buildClip(t.bot_url, t.team_number));
        q.appendChild(buildInfo(t, i < red.length ? "red" : "blue", { compact: true, minimal: true }));
        g.appendChild(q);
      });
    });
  }

  // Finals spotlight: robot 360 + info (left half), team clip (right half).
  function layoutFinals(t) {
    show("mode-finals", function (g) {
      var left = el("div", "left");
      left.appendChild(buildClip(t.bot_url, t.team_number));
      left.appendChild(buildInfo(t, "blue"));
      var right = el("div", "right");
      right.appendChild(buildClip(t.team_url, null));
      g.appendChild(left);
      g.appendChild(right);
    });
  }

  function renderSpotlight(number) {
    return fetchFeed([number]).then(function (feed) {
      if (spotlightTeam !== number) return; // superseded while loading
      layoutFinals(normalizeTeam(number, feed));
    });
  }

  function renderMatch(payload) {
    lastMatch = payload || null;
    if (spotlightTeam) return Promise.resolve(); // spotlight wins until cleared
    if (!payload) { clearGrid(); return Promise.resolve(); }
    var redRaw = payload.redTeams || [];
    var blueRaw = payload.blueTeams || [];
    var numbers = redRaw.concat(blueRaw).map(teamNumberOf).filter(Boolean);
    if (!numbers.length) { clearGrid(); return Promise.resolve(); }

    return fetchFeed(numbers).then(function (feed) {
      if (spotlightTeam || lastMatch !== payload) return; // state moved on while fetching
      var red = redRaw.map(function (t) { return normalizeTeam(t, feed); });
      var blue = blueRaw.map(function (t) { return normalizeTeam(t, feed); });
      var forced = query.get("mode");
      var count = red.length + blue.length;
      if (forced === "iq" || (forced !== "vrc" && count === 2)) layoutIq(red.concat(blue));
      else layoutVrc(red, blue);
    });
  }

  function setSpotlight(number) {
    spotlightTeam = number ? String(number).toUpperCase() : null;
    if (spotlightTeam) return renderSpotlight(spotlightTeam);
    var payload = lastMatch;
    lastMatch = null;
    return renderMatch(payload);
  }

  // ── WebSocket connection with exponential backoff reconnect ───────────
  // (Appendix A.14: 1s, 2s, 4s, 8s, 16s, capped at 30s. Native WebSocket,
  // no framework — plan Appendix B.3.) No "Reconnecting..." banner is
  // rendered here (unlike prompter.html) — Appendix A.6 requires this page
  // to show nothing at all when it has no match data, and a disconnected
  // overlay simply keeps showing (or fades to) the transparent empty
  // state, which is the correct on-stream behaviour.
  var RECONNECT_DELAYS = [1000, 2000, 4000, 8000, 16000, 30000];
  var reconnectAttempt = 0;
  var ws = null;

  function wsUrl() {
    var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + window.location.host + "/ws/overlay/" + encodeURIComponent(CONFIG.entityId);
  }

  function connect() {
    try {
      ws = new WebSocket(wsUrl());
    } catch (err) {
      scheduleReconnect();
      return;
    }

    ws.onopen = function () {
      reconnectAttempt = 0;
    };

    ws.onmessage = function (event) {
      var msg;
      try {
        msg = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      handleMessage(msg);
    };

    ws.onclose = function () {
      scheduleReconnect();
    };

    ws.onerror = function () {
      // onclose fires right after onerror for WebSocket; reconnect is
      // scheduled there to avoid double-scheduling.
    };
  }

  function scheduleReconnect() {
    var delay = RECONNECT_DELAYS[Math.min(reconnectAttempt, RECONNECT_DELAYS.length - 1)];
    reconnectAttempt += 1;
    window.setTimeout(connect, delay);
  }

  function handleMessage(msg) {
    if (!msg || typeof msg !== "object") return;
    var payload = msg.payload || msg;
    switch (msg.type) {
      case "upcoming_match": renderMatch(payload); break;
      case "match_cleared": renderMatch(null); break;
      case "show_team": setSpotlight(payload && payload.team); break;
      default: break; // forward-compatible: ignore unknown message types
    }
  }

  connect();
  if (query.get("team")) setSpotlight(query.get("team")); // static spotlight, e.g. for testing in OBS

  window.__overlayTestHooks = {
    handleMessage: handleMessage,
    renderMatch: renderMatch,
    setSpotlight: setSpotlight,
    normalizeTeam: normalizeTeam,
    flagFor: flagFor
  };
})();
</script>
</body>
</html>
