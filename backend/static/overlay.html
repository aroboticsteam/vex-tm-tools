<!DOCTYPE html>
<!--
  Standalone OBS overlay page (plan §5.14 / Appendix A.4, A.6, B.3).

  Per Appendix B.3, this is NOT part of the React SPA — a standalone HTML +
  vanilla JS page, no build step, served directly by FastAPI at
  GET /overlay/{entity_id}. The server is expected to:

    1. Read this file's bytes once at import time (mirroring
       `backend/main.py`'s `_PROMPTER_HTML` pattern).
    2. JSON-encode and substitute the `"__ENTITY_ID__"` placeholder below
       with the `entity_id` path parameter.
    3. Return the result as an `HTMLResponse`.

  Per Appendix A.1/A.15 there is NO auth on this page or its WebSocket —
  "security by obscurity of the entity_id" is the accepted model, since the
  URL is only ever pasted into an OBS Browser Source, not exposed to
  end users.

  Canvas is fixed at 1920x1080 (Appendix B.3: "designed for 1920x1080,
  document in OBS setup guide") — OBS Browser Sources render a page at a
  fixed pixel size, so this page does not attempt to be responsive.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TMTools Overlay</title>
<style>
  /* Fully transparent page: OBS composites straight through (Appendix A.6).
     No background panels or borders — only the clips and the info boxes. */
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; color: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; background: transparent; }
  #grid { position: absolute; inset: 0; opacity: 0; transition: opacity 500ms ease; pointer-events: none; }
  #grid.visible { opacity: 1; }

  /* Text is dark gold everywhere (issue #13). Every box is positioned in
     absolute 1920x1080 pixels, matching the agreed mockup. */
  :root { --gold: #b8860b; --red: #e5243b; --blue: #1fa3ec; }

  /* Clip areas: the clip keeps its own square ratio, never cropped. */
  .clip { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  .clip video { width: 100%; height: 100%; object-fit: contain; background: transparent; }
  .clip .placeholder { font-size: 56px; font-weight: 700; letter-spacing: 0.06em; color: var(--gold); text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  /* Match banner (top centre) */
  .banner { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: #fff; color: var(--gold);
    font-weight: 600; font-size: 54px; padding: 6px 110px; white-space: nowrap;
    clip-path: polygon(0 0, 100% 0, 94% 100%, 6% 100%); }

  /* Country flag badge */
  .flag { position: absolute; z-index: 3; top: 0; min-width: 84px; height: 50px; padding: 0 8px; box-sizing: border-box; background: #fff;
    color: #a32d2d; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; border-radius: 4px; overflow: hidden; }
  .flag img { height: 100%; width: auto; display: block; }

  /* Team cell: angled panel + square robot 360 + label */
  .cell { position: absolute; width: 595px; height: 378px; }
  .cell.iq { width: 653px; height: 410px; }
  .cell .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 60%; }
  .cell .panel.red { background: var(--red); clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%); }
  .cell .panel.blue { background: var(--blue); clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%); }
  .cell.iq .panel.blue.left { clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%); }
  .cell .bot { position: absolute; z-index: 2; top: 0; left: 4%; height: 84%; aspect-ratio: 1 / 1; }
  .cell .label { position: absolute; z-index: 1; bottom: 6%; right: 6%; width: 38%; text-align: right; color: var(--gold); line-height: 1.12; }
  .cell .label .number { font-size: 60px; font-weight: 700; letter-spacing: 0.02em; }
  .cell .label .name { font-size: 28px; font-weight: 500; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cell .label .robot { font-size: 22px; font-style: italic; }
  .cell.right .bot { left: auto; right: 4%; }
  .cell.right .label { right: auto; left: 6%; text-align: left; }
  .cell .flag { left: 0; }
  .cell.right .flag { left: auto; right: 0; }

  #grid.mode-vrc .banner, #grid.mode-iq .banner { z-index: 4; }
  .vs { position: absolute; left: 50%; top: 80%; transform: translate(-50%, -50%); font-size: 170px; font-weight: 700; color: #fff;
    -webkit-text-stroke: 5px #111; paint-order: stroke fill; letter-spacing: -4px; }

  /* Single-team spotlight: robot 360 above a red label bar, keyed team clip on the right. */
  #grid.mode-finals .bot { position: absolute; left: 4%; bottom: 24.5%; height: 42%; aspect-ratio: 1 / 1; z-index: 2; }
  #grid.mode-finals .bar { position: absolute; left: 0; bottom: 8%; width: 38%; box-sizing: border-box; background: var(--red); color: var(--gold);
    padding: 14px 8% 14px 6%; clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%); }
  #grid.mode-finals .bar .number { font-size: 64px; font-weight: 700; line-height: 1.05; }
  #grid.mode-finals .bar .name { font-size: 30px; font-weight: 500; }
  #grid.mode-finals .bar .robot { font-size: 22px; font-style: italic; }
  #grid.mode-finals .bar .flag { top: 50%; transform: translateY(-50%); right: 9%; }
  #grid.mode-finals .teamvid { position: absolute; right: 15%; bottom: 8%; height: 63%; aspect-ratio: 1 / 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG = { entityId: "__ENTITY_ID__" };

  function fallbackFromUrl() {
    var path = window.location.pathname.split("/").filter(Boolean);
    var idx = path.indexOf("overlay");
    if (CONFIG.entityId === "__ENTITY_ID__" && idx !== -1 && path[idx + 1]) {
      CONFIG.entityId = decodeURIComponent(path[idx + 1]);
    }
  }
  fallbackFromUrl();

  var query = new URLSearchParams(window.location.search);
  var gridEl = document.getElementById("grid");
  var lastMatch = null;     // last upcoming_match payload (so spotlight can return to it)
  var spotlightTeam = null; // team number being featured (finals mode), or null

  // ── Flags: country name -> ISO 3166 alpha-2 code ─────────────────────
  // Shown as an image from flagcdn.com when reachable, else as the white
  // code badge from the mockup (so an offline stream still reads correctly).
  var ISO = {
    "united kingdom": "gb", "uk": "gb", "u.k.": "gb", "great britain": "gb", "gb": "gb", "england": "gb", "scotland": "gb", "wales": "gb", "northern ireland": "gb",
    "turkey": "tr", "türkiye": "tr", "turkiye": "tr", "united states": "us", "usa": "us", "united states of america": "us", "canada": "ca", "mexico": "mx",
    "china": "cn", "hong kong": "hk", "taiwan": "tw", "japan": "jp", "south korea": "kr", "korea": "kr", "india": "in", "australia": "au", "new zealand": "nz",
    "singapore": "sg", "malaysia": "my", "thailand": "th", "philippines": "ph", "indonesia": "id", "vietnam": "vn", "saudi arabia": "sa",
    "united arab emirates": "ae", "uae": "ae", "qatar": "qa", "egypt": "eg", "south africa": "za", "brazil": "br", "chile": "cl", "colombia": "co",
    "argentina": "ar", "ireland": "ie", "france": "fr", "germany": "de", "spain": "es", "italy": "it", "portugal": "pt", "netherlands": "nl",
    "belgium": "be", "switzerland": "ch", "austria": "at", "poland": "pl", "czech republic": "cz", "czechia": "cz", "sweden": "se", "norway": "no",
    "denmark": "dk", "finland": "fi", "greece": "gr", "romania": "ro", "bulgaria": "bg", "hungary": "hu", "ukraine": "ua", "israel": "il", "jordan": "jo",
    "kuwait": "kw", "bahrain": "bh", "oman": "om", "pakistan": "pk", "sri lanka": "lk", "bangladesh": "bd", "nepal": "np", "kazakhstan": "kz"
  };
  function isoFor(country) {
    var c = String(country || "").trim().toLowerCase();
    if (/^[a-z]{2}$/.test(c) && c !== "uk") return c;
    return ISO[c] || "";
  }
  function flagFor(country) { return isoFor(country).toUpperCase(); }

  function buildFlag(country) {
    var code = isoFor(country);
    if (!code) return null;
    var box = el("div", "flag");
    var img = document.createElement("img");
    img.alt = code.toUpperCase();
    img.src = "https://flagcdn.com/h40/" + code + ".png";
    img.onerror = function () { box.removeChild(img); box.textContent = code.toUpperCase(); };
    box.appendChild(img);
    return box;
  }

  var ROUNDS = { QUAL: "Q", PRACTICE: "P", PRAC: "P", R16: "R16", QF: "QF", SF: "SF", F: "F", FINAL: "F", FINALS: "F", SKILLS: "S" };
  function bannerText(payload) {
    var round = String((payload && payload.round) || "").toUpperCase();
    var num = payload && payload.matchNum;
    var prefix = ROUNDS[round] || round.slice(0, 3);
    return [prefix, num != null ? num : ""].filter(function (x) { return x !== ""; }).join(" ");
  }

  function teamNumberOf(t) {
    return (typeof t === "string") ? t : (t && (t.team_number || t.number)) || "";
  }

  // Merges the match payload's team entry (string or enriched object) with
  // the public overlay feed's display info + clip URLs.
  function normalizeTeam(team, feed) {
    var obj = (typeof team === "string") ? { team_number: team } : (team || {});
    var number = obj.team_number || obj.number || "";
    var info = (feed && feed[number]) || {};
    return {
      team_number: number,
      team_name: info.team_name || obj.team_name || obj.name || null,
      organisation: info.organisation || null,
      location: info.location || null,
      country: info.country || null,
      rank: (info.qual_rank != null ? info.qual_rank : obj.rank) || null,
      bot_url: info.bot_url || obj.video_url || null,
      team_url: info.team_url || null,
      robot_name: info.robot_name || null
    };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null && text !== "") e.textContent = text;
    return e;
  }

  function buildClip(url, fallbackText) {
    var box = el("div", "clip");
    if (url) {
      var v = document.createElement("video");
      v.src = url; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
      box.appendChild(v);
    } else if (fallbackText) {
      box.appendChild(el("div", "placeholder", fallbackText));
    }
    return box;
  }

  var showRobotName = false; // set from the feed (server opt-in) or ?robot_name=1

  function fetchFeed(teamNumbers) {
    if (!teamNumbers.length) return Promise.resolve({});
    var qs = encodeURIComponent(teamNumbers.join(","));
    return fetch("/api/v1/public/overlay/teams?teams=" + qs, { credentials: "same-origin" })
      .then(function (resp) { if (!resp.ok) throw new Error("overlay feed " + resp.status); return resp.json(); })
      .then(function (data) {
        showRobotName = !!(data && data.show_robot_name) || query.get("robot_name") === "1";
        return (data && data.teams) || {};
      })
      .catch(function () { return {}; }); // no feed -> placeholders, never throws
  }

  var fadeTimer = null;
  function clearGrid() {
    gridEl.classList.remove("visible");
    if (fadeTimer) window.clearTimeout(fadeTimer);
    fadeTimer = window.setTimeout(function () { gridEl.innerHTML = ""; gridEl.className = ""; }, 500);
  }

  function show(modeClass, build) {
    if (fadeTimer) { window.clearTimeout(fadeTimer); fadeTimer = null; }
    gridEl.innerHTML = "";
    gridEl.classList.remove("visible");
    gridEl.className = modeClass;
    build(gridEl);
    // eslint-disable-next-line no-unused-expressions
    gridEl.offsetHeight;
    gridEl.classList.add("visible");
  }

  function buildCell(t, side, panelClass, extraClass, pos) {
    var cell = el("div", "cell " + side + (extraClass ? " " + extraClass : ""));
    cell.style.top = pos.top + "px";
    cell.style[side === "right" ? "right" : "left"] = "38px";
    cell.appendChild(el("div", "panel " + panelClass + (side === "left" && extraClass === "iq" ? " left" : "")));
    var label = el("div", "label");
    label.appendChild(el("div", "number", t.team_number));
    if (t.team_name) label.appendChild(el("div", "name", t.team_name));
    if (showRobotName && t.robot_name) label.appendChild(el("div", "robot", "\uD83E\uDD16 " + t.robot_name));
    cell.appendChild(label);
    var bot = buildClip(t.bot_url, t.team_number);
    bot.classList.add("bot");
    cell.appendChild(bot);
    var flag = buildFlag(t.country);
    if (flag) cell.appendChild(flag);
    return cell;
  }

  function addBanner(g, payload) {
    var text = bannerText(payload);
    if (text) g.appendChild(el("div", "banner", text));
  }

  // IQ: two teams, one each side, same light blue panels, no VS.
  function layoutIq(teams, payload) {
    show("mode-iq", function (g) {
      addBanner(g, payload);
      teams.slice(0, 2).forEach(function (t, i) {
        g.appendChild(buildCell(t, i === 0 ? "left" : "right", "blue", "iq", { top: 508 }));
      });
    });
  }

  // VRC: red alliance on the left, blue on the right, 2x2 with a large VS low in the frame.
  function layoutVrc(red, blue, payload) {
    show("mode-vrc", function (g) {
      addBanner(g, payload);
      var tops = [216, 648];
      red.slice(0, 2).forEach(function (t, i) { g.appendChild(buildCell(t, "left", "red", "", { top: tops[i] })); });
      blue.slice(0, 2).forEach(function (t, i) { g.appendChild(buildCell(t, "right", "blue", "", { top: tops[i] })); });
      g.appendChild(el("div", "vs", "VS"));
    });
  }

  // Single-team spotlight: square robot 360 above a red label bar, keyed team clip on the right.
  function layoutFinals(t) {
    show("mode-finals", function (g) {
      var bot = buildClip(t.bot_url, t.team_number);
      bot.classList.add("bot");
      g.appendChild(bot);
      var bar = el("div", "bar");
      bar.appendChild(el("div", "number", t.team_number));
      if (t.team_name) bar.appendChild(el("div", "name", t.team_name));
      if (showRobotName && t.robot_name) bar.appendChild(el("div", "robot", "\uD83E\uDD16 " + t.robot_name));
      var flag = buildFlag(t.country);
      if (flag) bar.appendChild(flag);
      g.appendChild(bar);
      var vid = buildClip(t.team_url, null);
      vid.classList.add("teamvid");
      g.appendChild(vid);
    });
  }

  function renderSpotlight(number) {
    return fetchFeed([number]).then(function (feed) {
      if (spotlightTeam !== number) return; // superseded while loading
      layoutFinals(normalizeTeam(number, feed));
    });
  }

  function renderMatch(payload) {
    lastMatch = payload || null;
    if (spotlightTeam) return Promise.resolve(); // spotlight wins until cleared
    if (!payload) { clearGrid(); return Promise.resolve(); }
    var redRaw = payload.redTeams || [];
    var blueRaw = payload.blueTeams || [];
    var numbers = redRaw.concat(blueRaw).map(teamNumberOf).filter(Boolean);
    if (!numbers.length) { clearGrid(); return Promise.resolve(); }

    return fetchFeed(numbers).then(function (feed) {
      if (spotlightTeam || lastMatch !== payload) return; // state moved on while fetching
      var red = redRaw.map(function (t) { return normalizeTeam(t, feed); });
      var blue = blueRaw.map(function (t) { return normalizeTeam(t, feed); });
      var forced = query.get("mode");
      var count = red.length + blue.length;
      if (forced === "iq" || (forced !== "vrc" && count === 2)) layoutIq(red.concat(blue), payload);
      else layoutVrc(red, blue, payload);
    });
  }

  function setSpotlight(number) {
    spotlightTeam = number ? String(number).toUpperCase() : null;
    if (spotlightTeam) return renderSpotlight(spotlightTeam);
    var payload = lastMatch;
    lastMatch = null;
    return renderMatch(payload);
  }

  // ── WebSocket connection with exponential backoff reconnect ───────────
  // (Appendix A.14: 1s, 2s, 4s, 8s, 16s, capped at 30s. Native WebSocket,
  // no framework — plan Appendix B.3.) No "Reconnecting..." banner is
  // rendered here (unlike prompter.html) — Appendix A.6 requires this page
  // to show nothing at all when it has no match data, and a disconnected
  // overlay simply keeps showing (or fades to) the transparent empty
  // state, which is the correct on-stream behaviour.
  var RECONNECT_DELAYS = [1000, 2000, 4000, 8000, 16000, 30000];
  var reconnectAttempt = 0;
  var ws = null;

  function wsUrl() {
    var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + window.location.host + "/ws/overlay/" + encodeURIComponent(CONFIG.entityId);
  }

  function connect() {
    try {
      ws = new WebSocket(wsUrl());
    } catch (err) {
      scheduleReconnect();
      return;
    }

    ws.onopen = function () {
      reconnectAttempt = 0;
    };

    ws.onmessage = function (event) {
      var msg;
      try {
        msg = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      handleMessage(msg);
    };

    ws.onclose = function () {
      scheduleReconnect();
    };

    ws.onerror = function () {
      // onclose fires right after onerror for WebSocket; reconnect is
      // scheduled there to avoid double-scheduling.
    };
  }

  function scheduleReconnect() {
    var delay = RECONNECT_DELAYS[Math.min(reconnectAttempt, RECONNECT_DELAYS.length - 1)];
    reconnectAttempt += 1;
    window.setTimeout(connect, delay);
  }

  function handleMessage(msg) {
    if (!msg || typeof msg !== "object") return;
    var payload = msg.payload || msg;
    switch (msg.type) {
      case "upcoming_match": renderMatch(payload); break;
      case "match_cleared": renderMatch(null); break;
      case "show_team": setSpotlight(payload && payload.team); break;
      default: break; // forward-compatible: ignore unknown message types
    }
  }

  connect();
  if (query.get("team")) setSpotlight(query.get("team")); // static spotlight, e.g. for testing in OBS

  window.__overlayTestHooks = {
    handleMessage: handleMessage,
    renderMatch: renderMatch,
    setSpotlight: setSpotlight,
    normalizeTeam: normalizeTeam,
    flagFor: flagFor,
    bannerText: bannerText
  };
})();
</script>
</body>
</html>
