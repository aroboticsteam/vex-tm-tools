<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Station</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0f1115; color: #eceff4; display: flex; flex-direction: column;
         font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  header { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; background: #161a23; border-bottom: 1px solid #262c3c; }
  header h1 { margin: 0; font-size: 1.2rem; flex: 1; }
  #status { font-size: .8rem; color: #6b7389; }
  nav { display: flex; gap: .4rem; padding: .5rem 1rem; overflow-x: auto; }
  nav button { background: #1d2230; border: 1px solid #2c3347; color: #cfd5e4; border-radius: 999px; padding: .55rem 1.1rem; font-size: 1rem; white-space: nowrap; }
  nav button.active { background: #3b6fe0; border-color: #3b6fe0; color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { background: #1f2638; border: 1px solid #3a4666; border-left: 8px solid #5b9dff; border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
  .msg .text { font-size: 2.2rem; line-height: 1.25; white-space: pre-wrap; word-break: break-word; }
  .msg .when { margin-top: .5rem; font-size: .9rem; color: #8e97ad; }
  .msg.flash { animation: flash 0.8s steps(2, jump-none) infinite; border-left-color: #ff4d4d; }
  @keyframes flash { 0% { background: #5a1620; } 100% { background: #1f2638; } }
  .empty { color: #6b7389; font-size: 1.3rem; text-align: center; margin-top: 3rem; }
  .history .msg { padding: .6rem 1rem; opacity: .75; } .history .msg .text { font-size: 1.1rem; }
  .compose { display: flex; gap: .5rem; margin-top: 1rem; }
  .compose input { flex: 1; font-size: 1.1rem; padding: .8rem 1rem; border-radius: 10px; border: 1px solid #2c3347; background: #161a23; color: #eceff4; }
  .compose button, .ack { background: #3b6fe0; color: #fff; border: 0; border-radius: 10px; padding: .8rem 1.4rem; font-size: 1.1rem; }
  .ack { margin-top: .8rem; background: #444d66; }
  .count { text-align: center; }
  .count .label { font-size: 1.6rem; color: #aeb6c8; }
  .count .clock { font-size: 7rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .count .clock.late { color: #ff6b6b; }
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .8rem; margin-top: 1.2rem; text-align: left; }
  .team { border-radius: 12px; padding: .8rem 1rem; background: #1d2230; border-left: 8px solid #3b6fe0; }
  .team.red { border-left-color: #e63946; } .team.blue { border-left-color: #457bff; }
  .team .num { font-size: 1.6rem; font-weight: 800; } .team .meta { color: #aeb6c8; font-size: 1rem; }
  .agenda .row { display: flex; gap: 1rem; padding: .7rem 1rem; border-radius: 10px; font-size: 1.15rem; color: #aeb6c8; }
  .agenda .row .t { width: 11rem; flex: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .agenda .row.current { background: #1f2f55; color: #fff; font-weight: 800; font-size: 1.5rem; }
  .agenda .row .d { display: block; font-weight: 400; font-size: 1rem; color: #aeb6c8; }
</style>
</head>
<body>
<header><h1 id="name">Station</h1><span id="status">connecting…</span></header>
<nav id="tabs"></nav>
<main id="view"></main>
<script>
(function () {
  var SLUG = "__STATION_SLUG__";
  var LABELS = { messages: 'Messages', countdown: 'Next match', agenda_day: 'Day agenda', agenda_finals: 'Finals agenda' };
  var state = { station: null, screen: 'messages', messages: [], flashing: null, next: null, agenda: {} };
  var viewEl = document.getElementById('view'), tabsEl = document.getElementById('tabs'), statusEl = document.getElementById('status');
  var timer = null;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined && text !== null) n.textContent = text; return n; }
  function api(path, opts) { return fetch('/api/v1/public/stations/' + encodeURIComponent(SLUG) + path, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.status === 204 ? null : r.json(); }); }
  function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

  function setScreen(screen) {
    if (!state.station || state.station.screens.indexOf(screen) === -1) return;
    state.screen = screen;
    if (screen === 'countdown') loadNext();
    if (screen === 'agenda_day') loadAgenda('day');
    if (screen === 'agenda_finals') loadAgenda('finals');
    render();
  }

  function renderTabs() {
    tabsEl.replaceChildren();
    if (!state.station) return;
    state.station.screens.forEach(function (s) {
      var b = el('button', s === state.screen ? 'active' : '', LABELS[s] || s);
      b.addEventListener('click', function () { setScreen(s); });
      tabsEl.appendChild(b);
    });
  }

  function messageBox(m, big) {
    var box = el('div', 'msg' + (m.flash && big && state.flashing === m.id ? ' flash' : ''));
    box.appendChild(el('div', 'text', m.text));
    box.appendChild(el('div', 'when', fmtTime(m.sent_at)));
    return box;
  }

  function renderMessages() {
    if (!state.messages.length) viewEl.appendChild(el('div', 'empty', 'No messages yet'));
    else {
      var latest = state.messages[0];
      viewEl.appendChild(messageBox(latest, true));
      if (state.flashing === latest.id) {
        var ack = el('button', 'ack', 'Got it');
        ack.addEventListener('click', function () { state.flashing = null; render(); });
        viewEl.appendChild(ack);
      }
      if (state.messages.length > 1) {
        var hist = el('div', 'history');
        state.messages.slice(1, 15).forEach(function (m) { hist.appendChild(messageBox(m, false)); });
        viewEl.appendChild(hist);
      }
    }
    var form = el('form', 'compose');
    var input = el('input'); input.placeholder = 'Message the desk…'; input.maxLength = 500; input.enterKeyHint = 'send';
    var send = el('button', null, 'Send'); send.type = 'submit';
    form.appendChild(input); form.appendChild(send);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      send.disabled = true;
      api('/messages', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: text }) })
        .then(function () { input.value = ''; send.textContent = 'Sent ✓'; })
        .catch(function () { send.textContent = 'Failed – retry'; })
        .then(function () { setTimeout(function () { send.disabled = false; send.textContent = 'Send'; }, 1500); });
    });
    viewEl.appendChild(form);
  }

  function teamCard(t, cls) {
    var c = el('div', 'team ' + cls);
    c.appendChild(el('div', 'num', (t.qual_rank != null ? '#' + t.qual_rank + '  ' : '') + t.team_number));
    if (t.team_name) c.appendChild(el('div', null, t.team_name));
    var meta = [t.organisation, t.location].filter(Boolean).join(' · ');
    if (meta) c.appendChild(el('div', 'meta', meta));
    if (t.skills_rank != null) c.appendChild(el('div', 'meta', 'Skills rank ' + t.skills_rank));
    return c;
  }

  function renderCountdown() {
    var n = state.next;
    if (!n || !n.available) { viewEl.appendChild(el('div', 'empty', 'No upcoming match')); return; }
    var box = el('div', 'count');
    box.appendChild(el('div', 'label', n.label + (n.division ? '  ·  Division ' + n.division : '') + (n.scheduled_at ? '  ·  ' + fmtTime(n.scheduled_at) : '')));
    var clock = el('div', 'clock', '--:--'); clock.id = 'clock';
    box.appendChild(clock);
    var teams = el('div', 'teams');
    n.red.forEach(function (t) { teams.appendChild(teamCard(t, 'red')); });
    n.blue.forEach(function (t) { teams.appendChild(teamCard(t, 'blue')); });
    box.appendChild(teams);
    viewEl.appendChild(box);
    tickClock();
  }

  function tickClock() {
    var clock = document.getElementById('clock'), n = state.next;
    if (!clock || !n || !n.scheduled_at) { if (clock) clock.textContent = '--:--'; return; }
    var secs = Math.round(n.scheduled_at - Date.now() / 1000), late = secs < 0, a = Math.abs(secs);
    var h = Math.floor(a / 3600), m = Math.floor((a % 3600) / 60), s = a % 60;
    clock.textContent = (late ? '-' : '') + (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
    clock.className = 'clock' + (late ? ' late' : '');
  }

  function currentAgendaIndex(items) {
    var now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), cur = -1;
    items.forEach(function (it, i) {
      var p = it.start_time.split(':'), start = +p[0] * 60 + +p[1];
      var end = null;
      if (it.end_time) { var q = it.end_time.split(':'); end = +q[0] * 60 + +q[1]; }
      if (start <= mins && (end === null || mins < end)) cur = i; // latest started item that hasn't ended
    });
    return cur;
  }

  function renderAgenda(scope) {
    var items = state.agenda[scope];
    if (!items) { viewEl.appendChild(el('div', 'empty', 'Loading…')); return; }
    if (!items.length) { viewEl.appendChild(el('div', 'empty', 'No agenda items yet')); return; }
    var wrap = el('div', 'agenda'), cur = currentAgendaIndex(items), currentEl = null;
    items.forEach(function (it, i) {
      var row = el('div', 'row' + (i === cur ? ' current' : ''));
      row.appendChild(el('div', 't', it.start_time + (it.end_time ? '–' + it.end_time : '')));
      var body = el('div');
      body.appendChild(el('span', null, it.title));
      if (it.details) body.appendChild(el('span', 'd', it.details));
      row.appendChild(body);
      wrap.appendChild(row);
      if (i === cur) currentEl = row;
    });
    viewEl.appendChild(wrap);
    if (currentEl) currentEl.scrollIntoView({ block: 'center' });
  }

  function render() {
    renderTabs();
    viewEl.replaceChildren();
    if (state.screen === 'messages') renderMessages();
    else if (state.screen === 'countdown') renderCountdown();
    else if (state.screen === 'agenda_day') renderAgenda('day');
    else if (state.screen === 'agenda_finals') renderAgenda('finals');
  }

  function loadNext() { api('/next-match').then(function (n) { state.next = n; if (state.screen === 'countdown') render(); }).catch(function () {}); }
  function loadAgenda(scope) { api('/agenda?scope=' + scope).then(function (a) { state.agenda[scope] = a; render(); }).catch(function () {}); }

  function onMessage(m) {
    if (m.id && state.messages.some(function (x) { return x.id === m.id; })) return;
    state.messages.unshift({ id: m.id, text: m.text, flash: !!m.flash, sent_at: m.sent_at });
    if (m.flash) state.flashing = m.id;
    state.screen = 'messages'; // a new message always takes the screen
    render();
  }

  function load() {
    return api('').then(function (st) {
      state.station = st;
      document.title = st.name; document.getElementById('name').textContent = st.name;
      state.screen = st.screen;
      if (st.last_message && !state.messages.length) state.messages.push({ id: st.last_message.id, text: st.last_message.text, flash: false, sent_at: st.last_message.sent_at });
      setScreen(st.screen);
    });
  }

  var backoff = 1000, ws, ping;
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws/station/' + encodeURIComponent(SLUG));
    ws.onopen = function () { backoff = 1000; statusEl.textContent = 'live'; clearInterval(ping); ping = setInterval(function () { try { ws.send('ping'); } catch (e) {} }, 25000); };
    ws.onmessage = function (ev) {
      try { var m = JSON.parse(ev.data); if (m.type === 'message') onMessage(m); else if (m.type === 'screen') setScreen(m.screen); } catch (e) {}
    };
    ws.onclose = function () { clearInterval(ping); statusEl.textContent = 'reconnecting…'; setTimeout(function () { load().catch(function () {}); connect(); }, backoff); backoff = Math.min(backoff * 2, 15000); };
  }

  load().catch(function () { viewEl.appendChild(el('div', 'empty', 'Unknown station')); });
  connect();
  setInterval(function () { if (state.screen === 'countdown') tickClock(); }, 1000);
  setInterval(function () { if (state.screen === 'countdown') loadNext(); else if (state.screen.indexOf('agenda_') === 0) render(); }, 30000);
})();
</script>
</body>
</html>
