  :root {
    color-scheme: dark;
    --navy: #000E23; --gold: #9A8656;
    --bg: #000E23; --bg-2: #04162E; --card: #071A35; --raise: #0D2342; --line: #1B3050;
    --ink: #EEF1F6; --muted: #92A3BD; --gold-t: #C9B98E; --link: #5CC0DA; --accent-ink: #000E23;
    --red: #EE8DA0; --blue: #7CBDF0; --iq: #0C7C9D; --v5: #9A2339; --ok: #5FD29A;
    --head: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --card-line: var(--line);
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light;
      --bg: #F2F4F7; --bg-2: #E9ECF1; --card: #FFFFFF; --raise: #EEF1F5; --line: #D8DDE6;
      --ink: #000E23; --muted: #4B586D; --gold-t: #6E5F3A; --link: #0C6F8C; --red: #9A2339; --blue: #1D418E; --ok: #17704A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--head); text-wrap: balance; }

  /* header: navy in both themes, gold rule underneath */
  header { position: sticky; top: 0; z-index: 5; background: var(--navy); border-bottom: 2px solid var(--gold); }
  .bar { max-width: 1100px; margin: 0 auto; padding: .35rem 1rem 0; display: flex; flex-wrap: wrap; gap: 0 1.5rem; align-items: center; }
  .bar h1 { margin: 0; flex: 1 1 auto; font-size: 1rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; padding: .55rem 0; }
  nav { display: flex; gap: .1rem; flex-wrap: wrap; }
  nav a { color: #B4C0D4; padding: .75rem .85rem .65rem; border-bottom: 3px solid transparent; font-size: .92rem; font-weight: 500; letter-spacing: .02em; }
  nav a:hover { color: #fff; text-decoration: none; }
  nav a.active { color: #fff; border-bottom-color: var(--gold); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem; }

  h2 { margin: 2rem 0 .8rem; font-size: 1.05rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; display: flex; align-items: center; gap: .7rem; }
  h2:first-child { margin-top: 0; }
  h2:not([style])::before { content: ""; flex: 0 0 22px; height: 3px; background: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 1rem 1.1rem; }
  .grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .muted { color: var(--muted); } .empty { color: var(--muted); padding: 1.2rem 0; }
  .scroll { max-height: 28rem; overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: .55rem .8rem; text-align: left; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--bg-2); color: var(--muted); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; z-index: 1; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--raise); }
  td.n, th.n { font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { width: 1%; white-space: nowrap; padding-right: 1.4rem; }
  td { font-variant-numeric: tabular-nums; }
  td:first-child { font-weight: 600; }
  tr.top td:first-child { color: var(--gold-t); font-weight: 700; }
  .red { color: var(--red); } .blue { color: var(--blue); }
  .row-cur td { background: color-mix(in srgb, var(--gold) 22%, transparent); font-weight: 700; }
  .row-cur td:first-child { box-shadow: inset 3px 0 0 var(--gold); }

  .tabs { display: flex; gap: .45rem; flex-wrap: wrap; margin: .7rem 0; }
  .tabs button, select, input { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: .4rem .85rem; font: inherit; font-size: .92rem; }
  .tabs button { border-radius: 999px; cursor: pointer; }
  .tabs button:hover { border-color: var(--gold); }
  .tabs button.active { background: var(--gold); border-color: var(--gold); color: var(--accent-ink); font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .8rem; }
  input::placeholder { color: var(--muted); }

  .teamcard { display: block; color: inherit; position: relative; transition: border-color .15s, transform .15s; }
  .teamcard:hover { text-decoration: none; border-color: var(--gold); }
  .teamcard b { font-family: var(--head); font-size: 1.4rem; letter-spacing: .02em; }
  .teamcard div { font-size: .92rem; }
  .linkcard { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--ink); font-weight: 500; transition: border-color .15s; }
  .linkcard::after { content: "\2192"; color: var(--gold-t); font-size: 1.2rem; transition: transform .15s; }
  .linkcard:hover { text-decoration: none; border-color: var(--gold); } .linkcard:hover::after { transform: translateX(3px); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.1rem; }
  .kv dt { color: var(--muted); font-size: .85rem; } .kv dd { margin: 0; }
  .card > b { font-family: var(--head); font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gold-t); }
  .card.teamcard > b { font-size: 1.45rem; text-transform: none; letter-spacing: .02em; color: var(--ink); display: block; margin-bottom: .1rem; }
  video { max-width: 100%; border-radius: 10px; background: #000; }
  .clips { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 1rem; border: 1px solid var(--line); }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .map { position: relative; overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; background: #000; }
  .map .inner { position: relative; transform-origin: top left; } .map img { display: block; width: 100%; }
  .pin { position: absolute; transform: translate(-50%, -50%); background: var(--gold); color: var(--accent-ink); border: 2px solid #fff; border-radius: 999px; padding: .15rem .6rem; font-size: .8rem; font-weight: 600; cursor: pointer; }
  #pop { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 20; }
  #pop .box { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 1.2rem; max-width: 460px; width: 100%; max-height: 80vh; overflow: auto; }
  footer { max-width: 1100px; margin: 2rem auto 0; padding: 1.2rem 1rem 3rem; color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); }
  footer:empty { display: none; }

  /* hero: always navy, photo fills the screen without stretching */
  .hero { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; text-align: center; min-height: calc(100vh - 3.4rem); min-height: calc(100dvh - 3.4rem); margin: -1.25rem -1rem 0; padding: 2rem 1.2rem; color: #fff;
    background: radial-gradient(ellipse at 50% 0%, #0D2A52 0%, #000E23 70%); background-size: cover; background-position: center; background-repeat: no-repeat; width: 100vw; margin-left: calc(50% - 50vw); margin-right: 0; }
  .hero.has-img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #000E23cc 0%, #000E2355 40%, #000E23e6 100%); }
  .hero > * { position: relative; }
  .hero .kick { font-family: var(--mono); font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: #D6C8A2; }
  .hero h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4.6rem); line-height: 1.05; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 2px 22px #000c; max-width: 16ch; }
  .hero .rule { width: 72px; height: 3px; background: var(--gold); }
  .hero .hint { position: absolute; bottom: 1.3rem; left: 0; right: 0; font-family: var(--mono); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: #C3CEDF; }
  body { overflow-x: clip; } /* the hero fills the screen, keeps the photo's proportions (cropped, never stretched) */
  .section { padding-top: 2rem; }
  .strip { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 1.5rem; }
  .strip .stat { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: .8rem 1rem; }
  .strip .stat b { display: block; font-family: var(--head); font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .strip { margin-bottom: 1rem; }
  h2[style] { font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: .04em; }
  .strip .stat span { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }

  .vids .card > b, .vids b { display: block; } .vids video { width: 100%; }
  .vids { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .btn { display: inline-flex; align-items: center; background: var(--iq); color: #fff; border-radius: 8px; padding: .6rem 1.15rem; font-weight: 600; margin-top: .7rem; } .btn:hover { text-decoration: none; filter: brightness(1.12); }
  .hist { display: grid; gap: 1rem; }
  .hist .card { padding: 1.2rem 1.3rem; } .hist h3 { margin: 0 0 .15rem; font-size: 1.1rem; letter-spacing: .02em; } .hist .when { color: var(--muted); font-size: .88rem; margin-bottom: .9rem; font-family: var(--mono); }

          function tile(label, value) { if (value === undefined || value === null || value === '') return; var x = el('div', 'tile'); x.appendChild(el('b', null, String(value))); x.appendChild(el('span', null, label)); tiles.appendChild(x); }
          tile('Qualification rank', r.rank);
          var avg = r.average_points !== undefined ? r.average_points : r.avgPoints;
          if (typeof avg === 'number') tile('Average score', avg.toFixed(1));
          tile('High score', r.high_score !== undefined ? r.high_score : r.highScore);
          if (t.programme !== 'iq' && r.wins !== undefined && r.wins !== null) tile('Record (W-L-T)', r.wins + '-' + (r.losses || 0) + '-' + (r.ties || 0));
          if (r.division && r.division.name) tile('Division', r.division.name);
          if (tiles.childNodes.length) card.appendChild(tiles);
        });
        if (e.awards.length) { var chips = el('div', 'chips'); e.awards.forEach(function (a) { chips.appendChild(el('span', 'chip', '🏆 ' + a)); }); card.appendChild(chips); }
        hist.appendChild(card);
      });
      box.appendChild(hist);
    }
    return box;
  }

  // ── Livestreams ────────────────────────────────────────────────────
  function live(list) {
    var box = el('div');
    if (!list.length) return el('div', 'empty', 'No livestreams are configured yet.');
    list.forEach(function (r) {
      box.appendChild(el('h2', null, r.name));
      var f = el('div', 'frame'), i = document.createElement('iframe');
      i.src = r.stream_url; i.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; i.referrerPolicy = 'strict-origin-when-cross-origin'; i.allowFullscreen = true;
      f.appendChild(i); box.appendChild(f);
    });
    return box;
  }

  // ── Map ────────────────────────────────────────────────────────────
  function showPop(title, lines) {
    var pop = document.getElementById('pop'), b = document.getElementById('popbox'); b.replaceChildren(); b.appendChild(el('h2', null, title));
    if (!lines.length) b.appendChild(el('div', 'muted', 'Nothing listed for this room.'));
    lines.forEach(function (l) { b.appendChild(typeof l === 'string' ? el('div', null, l) : l); });
    var close = el('button', null, 'Close'); close.style.marginTop = '1rem'; close.addEventListener('click', function () { pop.style.display = 'none'; }); b.appendChild(close);
    pop.style.display = 'flex';
  }
  document.getElementById('pop').addEventListener('click', function (e) { if (e.target.id === 'pop') e.target.style.display = 'none'; });

  function mapView(o, list) {
    var m = o.map, box = el('div');
    if (!m || !m.image_url) return el('div', 'empty', 'The event map has not been published yet.');
    var zoom = 1, ctl = el('div', 'tools');
    var inner = el('div', 'inner'), img = el('img'); img.src = m.image_url; img.alt = 'Event map'; inner.appendChild(img);
    function setZoom(z) { zoom = Math.max(1, Math.min(4, z)); inner.style.width = (zoom * 100) + '%'; }
    [['−', -0.5], ['+', 0.5]].forEach(function (b) { var x = el('button', null, b[0]); x.addEventListener('click', function () { setZoom(zoom + b[1]); }); ctl.appendChild(x); });
    ctl.appendChild(el('span', 'muted', 'Zoom in and tap a room for details'));
    (m.rooms || []).forEach(function (r) {
      var p = el('button', 'pin', r.name); p.style.left = r.x + '%'; p.style.top = r.y + '%';
      p.addEventListener('click', function () {
        var inRoom = list.filter(function (t) { return (r.teams || []).indexOf(t.team_number) !== -1 || (t.pit_location && t.pit_location === r.name); });
        var lines = [];
        if (r.description) lines.push(r.description);
        inRoom.forEach(function (t) { var d = el('div'); d.appendChild(teamLink(t.team_number)); d.appendChild(document.createTextNode(t.team_name ? '  ' + t.team_name : '')); lines.push(d); });
        showPop(r.name, lines);
      });
      inner.appendChild(p);
    });
    var wrap = el('div', 'map'); wrap.appendChild(inner); box.appendChild(ctl); box.appendChild(wrap);
    return box;
  }

  // ── Router ─────────────────────────────────────────────────────────
  var evState = { tab: 'agenda', prog: '', div: '' }, teamState = { sort: 'number', q: '' };
  function render() {
    clearTimers();
    var hash = location.hash.replace(/^#/, '') || 'home', parts = hash.split('/'), page = parts[0];
    document.querySelectorAll('#nav a').forEach(function (a) { a.className = a.getAttribute('href') === '#' + (page === 'team' ? 'teams' : page) ? 'active' : ''; });
    var load;
    if (page === 'home') load = Promise.all([get('overview'), get('event')]).then(function (r) { return home(r[0], r[1]); });
    else if (page === 'event') load = get('event').then(function (d) { return event(d, evState); });
    else if (page === 'teams') load = get('teams').then(function (l) { return teams(l, teamState); });
    else if (page === 'team' && parts[1]) load = get('teams/' + encodeURIComponent(decodeURIComponent(parts[1]))).then(team);
    else if (page === 'live') load = get('livestreams').then(live);
    else if (page === 'map') load = Promise.all([get('overview'), get('teams')]).then(function (r) { return mapView(r[0], r[1]); });
    else load = Promise.resolve(el('div', 'empty', 'Page not found.'));
    var token = render.token = (render.token || 0) + 1;
    load.then(function (node) { if (token !== render.token) return; view.replaceChildren(node); window.scrollTo(0, 0); })
      .catch(function () { if (token === render.token) view.replaceChildren(el('div', 'empty', 'Could not load this page. Retrying…')); });
    if (page === 'event') timers.push(setInterval(function () { get('event').then(function (d) { if ((location.hash.replace(/^#/, '') || 'home') === 'event') { var y = window.scrollY; view.replaceChildren(event(d, evState)); window.scrollTo(0, y); } }).catch(function () {}); }, 30000));
  }

  var nav = document.getElementById('nav');
  NAV.forEach(function (n) { var a = el('a', null, n[1]); a.href = '#' + n[0]; nav.appendChild(a); });
  var alerts = el('a', null, 'Alerts'); alerts.href = '/notify'; nav.appendChild(alerts);
  get('overview').then(function (o) {
    document.title = o.title; document.getElementById('title').textContent = o.title;
    if (o.presented_by) document.getElementById('foot').textContent = 'Presented by ' + o.presented_by;
  }).catch(function () {});
  window.addEventListener('hashchange', render);
  render();
})();
</script>
