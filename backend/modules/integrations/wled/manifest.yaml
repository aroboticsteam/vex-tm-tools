domain: wled
name: "WLED LED Strips"
version: "1.0.0"
description: "WLED LED strip control (field LEDs) via the WLED JSON API."
requires_oauth: false
config_schema:
  host:
    type: string
    label: "WLED Host / IP"
    secret: false
  port:
    type: integer
    label: "HTTP Port"
    secret: false
services:
  set_power:
    description: "Turn the strip on or off."
    fields:
      on:
        type: boolean
        required: true
  set_brightness:
    description: "Set master brightness (0-255)."
    fields:
      brightness:
        type: integer
        required: true
  set_color:
    description: "Set the primary colour (hex like #FF0000, or r/g/b)."
    fields:
      color:
        type: string
        required: false
  set_preset:
    description: "Apply a saved WLED preset."
    fields:
      preset:
        type: integer
        required: true
  set_effect:
    description: "Apply an effect by id, with optional speed/intensity."
    fields:
      effect:
        type: integer
        required: true
  flash:
    description: "Flash the strip (colour, count, interval) then restore its previous state. Used for 'something special happened' triggers."
    fields:
      color:
        type: string
        required: false
      count:
        type: integer
        required: false
      interval_ms:
        type: integer
        required: false
