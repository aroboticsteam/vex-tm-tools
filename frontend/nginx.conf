# Static-only server for the built SPA (the `frontend` image target in the
# repo's Dockerfile). It serves the React app and falls back to index.html
# for client-side routes; it does NOT proxy the API. Put a reverse proxy
# (Traefik/ingress) in front that sends /api, /auth, /admin_login, /ws,
# /prompter, /overlay, /room/, /notify, /sw.js, /healthz and /readyz to the backend and everything
# else here, so the browser sees one origin (same as the bundled image).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
