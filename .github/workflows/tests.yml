name: Tests

on:
  push:
    branches: [ "main", "qecomp-rewrite" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qecomp
          POSTGRES_PASSWORD: qecomp
          POSTGRES_DB: qecomp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qecomp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql+asyncpg://qecomp:qecomp@localhost:5433/qecomp
      REDIS_URL: redis://localhost:6380/0
      SECRET_KEY: ci-secret-key
      ENCRYPTION_KEY: aOxVeYyoRQV2E8j8WvA-N5-N2CkbG9zA6QAKnHo0dRI=
      ADMIN_LOCAL_PASSWORD: ci-admin-password
      OIDC_ISSUER_URL: https://example.invalid/oidc
      OIDC_CLIENT_ID: dummy
      OIDC_CLIENT_SECRET: dummy
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: qecomp-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Real MinIO (not moto) so the S3 multipart-upload/presign tests
      # (tests/test_media/test_s3.py) and the real-ffmpeg-and-S3 team
      # video test (tests/test_routers/test_teams.py) run instead of
      # self-skipping. GH Actions `services:` can't pass MinIO's required
      # `server /data` command args, so it's started as a plain container
      # instead. Pulled from Chainguard's mirror — MinIO locked anonymous
      # pulls of its own images on both Docker Hub (2025) and quay.io
      # (2026-09-24), so neither of those is usable here anymore without
      # authenticating.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create MinIO test bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            cgr.dev/chainguard/minio-client:latest-dev mb --ignore-existing local/${{ env.S3_BUCKET }}

      - name: Alembic migrate
        run: alembic upgrade head

      - name: Confirm single Alembic head
        run: |
          heads=$(alembic heads)
          echo "$heads"
          [ "$(echo "$heads" | grep -c '(head)')" -eq 1 ]

      - name: Run pytest with coverage
        working-directory: backend
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=80

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    # Real browser against the real backend (serving the built SPA), Postgres,
    # Redis and MinIO. See docs/TESTING.md.
    runs-on: ubuntu-latest
    needs: []

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qecomp
          POSTGRES_PASSWORD: qecomp
          POSTGRES_DB: qecomp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qecomp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql+asyncpg://qecomp:qecomp@localhost:5433/qecomp
      REDIS_URL: redis://localhost:6380/0
      SECRET_KEY: ci-secret-key
      ENCRYPTION_KEY: aOxVeYyoRQV2E8j8WvA-N5-N2CkbG9zA6QAKnHo0dRI=
      ADMIN_LOCAL_PASSWORD: ci-admin-password
      OIDC_ISSUER_URL: https://example.invalid/oidc
      OIDC_CLIENT_ID: dummy
      OIDC_CLIENT_SECRET: dummy
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: qecomp-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      E2E_BASE_URL: http://localhost:8765

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            cgr.dev/chainguard/minio-client:latest-dev mb --ignore-existing local/${{ env.S3_BUCKET }}

      - name: Migrate and seed
        run: |
          alembic upgrade head
          python tools/e2e_seed.py

      - name: Build the SPA into the backend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf ../backend/static/frontend
          cp -R dist ../backend/static/frontend

      - name: Start the backend
        run: |
          nohup python -m uvicorn backend.main:app --port 8765 > uvicorn.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:8765/healthz && break; sleep 1; done

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e

      - name: Upload report and backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            uvicorn.log
          retention-days: 7
