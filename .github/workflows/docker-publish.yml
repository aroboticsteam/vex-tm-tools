name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Publishes two images to the same repository, told apart by tag:
#   ghcr.io/<repo>:backend   the API with the built SPA bundled in (Dockerfile `backend` target)
#   ghcr.io/<repo>:frontend  just the built SPA behind nginx        (Dockerfile `frontend` target)
#
# Every tag is also mirrored to registry.kmnet.uk/vex-tm-tools (same tags) when
# the KMNET_REGISTRY_USERNAME / KMNET_REGISTRY_PASSWORD repo secrets are set,
# for hosts that cannot reach ghcr.io (e.g. behind a TLS-inspecting proxy).
#
# Each image is built for linux/amd64 and linux/arm64 natively (one job per
# arch, on GitHub's own amd64/arm64 runners — no QEMU emulation) and merged
# into a single multi-arch manifest, so `docker pull` on an arm64 host (e.g.
# an Apple Silicon dev machine, or an arm64 k8s node) doesn't fail.

on:
  schedule:
    - cron: '36 3 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Secondary registry the merged manifests are mirrored to (see header).
  MIRROR_REGISTRY: registry.kmnet.uk
  MIRROR_IMAGE_NAME: vex-tm-tools

jobs:
  build:
    # Native builds: arm64 on GitHub's arm runner, amd64 on the default one.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        component: [ backend, frontend ]
        platform: [ linux/amd64, linux/arm64 ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a PR this just validates the Dockerfile target builds for this
      # platform — nothing is pushed, so there's no digest to merge later.
      - name: Build ${{ matrix.component }} (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform }}

      # Push by digest (not by tag) — each arch's build pushes an
      # untagged, platform-specific image; the merge job below combines
      # both digests into one multi-arch manifest under the real tags.
      - name: Build and push ${{ matrix.component }} by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [ backend, frontend ]
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Tags: the moving `:backend` / `:frontend` tag (what deployments pull),
      # plus an immutable `<short-sha>-<component>` tag and, for `vX.Y.Z` git
      # tags, `<version>-<component>`.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.component }}
            type=sha,prefix=,suffix=-${{ matrix.component }}
            type=semver,pattern={{version}},suffix=-${{ matrix.component }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          # metadata-action's `tags` output is one tag per line.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_ARGS=$(echo "$TAGS" | xargs -I {} echo -n "-t {} ")
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # Copy the finished multi-arch manifest (all tags) to the mirror
      # registry. Skipped when its credentials are not configured.
      - name: Mirror to ${{ env.MIRROR_REGISTRY }}
        env:
          MIRROR_USER: ${{ secrets.KMNET_REGISTRY_USERNAME }}
          MIRROR_PASS: ${{ secrets.KMNET_REGISTRY_PASSWORD }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$MIRROR_USER" ] || [ -z "$MIRROR_PASS" ]; then
            echo "KMNET_REGISTRY_* secrets not set; skipping mirror"
            exit 0
          fi
          echo "$MIRROR_PASS" | docker login "$MIRROR_REGISTRY" -u "$MIRROR_USER" --password-stdin
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DST="${{ env.MIRROR_REGISTRY }}/${{ env.MIRROR_IMAGE_NAME }}"
          for ref in $TAGS; do
            tag="${ref##*:}"
            docker buildx imagetools create -t "$DST:$tag" "$ref"
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect $(echo "${{ steps.meta.outputs.tags }}" | head -n1)

      # Install cosign to sign the resulting multi-arch manifest.
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Sign every tag pointing at the merged multi-arch manifest. This
      # will only write to the public Rekor transparency log when the
      # Docker repository is public, to avoid leaking data. Pass --force
      # to cosign below to publish transparency data even for private
      # images.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}
