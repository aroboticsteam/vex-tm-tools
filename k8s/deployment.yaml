# QEComp backend Deployment (plan §15).
#
# HA model (plan §3.1, Appendix A.9): 3 replicas, one pod per node via
# required podAntiAffinity, each running exactly 1 uvicorn worker (see
# Dockerfile) that contends for a single Redis leader lock
# (backend.modules.leader.LeaderElection) — only the elected leader runs
# TimerManager/Loader/AutomationEngine/Scraper/Predictor; the passive pod
# still serves reads and the WS event fan-out. RollingUpdate keeps at least
# one pod up during deploys; the init container applies migrations before
# either pod's app container starts serving traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qecomp
  namespace: qecomp
  labels:
    app: qecomp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: qecomp
  template:
    metadata:
      labels:
        app: qecomp
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - qecomp
              topologyKey: "kubernetes.io/hostname"
      initContainers:
        - name: migrate
          image: ghcr.io/vmd1/vex-tm-tools-priv:latest
          command: ["alembic", "upgrade", "head"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: qecomp-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: POSTGRES_DSN
      containers:
        - name: qecomp
          image: ghcr.io/vmd1/vex-tm-tools-priv:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: qecomp-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: POSTGRES_DSN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: REDIS_URL
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: OIDC_ISSUER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: OIDC_CLIENT_SECRET
            - name: ADMIN_LOCAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: ADMIN_LOCAL_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: ENCRYPTION_KEY
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: S3_SECRET_KEY
            # Web Push (team/staff notifications). Optional: without them push is
            # disabled but room displays still receive alerts. Generate with
            # `python tools/generate_vapid_keys.py`.
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: VAPID_PRIVATE_KEY
                  optional: true
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: qecomp-secrets
                  key: VAPID_PUBLIC_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
